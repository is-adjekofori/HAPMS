services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hapms
      MYSQL_USER: hapms
      MYSQL_PASSWORD: hapms
      MYSQL_ROOT_PASSWORD: hapms_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "hapms", "-phapms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
