services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hapms}
      MYSQL_USER: ${MYSQL_USER:-hapms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hapms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hapms_root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${MYSQL_USER:-hapms}",
          "-p${MYSQL_PASSWORD:-hapms}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
